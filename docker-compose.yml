# Task 03 stack: API + Postgres + artifact folders
# From Task[03]:
#   docker compose up --build
#
# Secrets come from .env (copy .env.example). Never commit real passwords.

services:
  postgres:
    image: postgres:16
    container_name: olist-task03-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    volumes:
      - task03_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olist-task03-api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OLIST_MLFLOW_TRACKING_URI: mlruns
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # artifact store the container can reach (not laptop-only paths in code)
      - ./mlruns:/app/mlruns
      - ./models:/app/models
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  task03_pgdata:
