# catch problems before the push
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(app|src|tests)/
      - id: ruff-format
        files: ^(app|src|tests)/

  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        files: ^(app|src|tests)/
