# all settings live here, not inside the python files
# later the API and docker will read the same file

project:
  name: olist_late_delivery
  task: task03

# inference only. training stays in the Task[02] notebooks
problem:
  label: is_late
  positive_name: late
  negative_name: on_time
  metric: f1_late

model:
  name: gbdt_weighted
  version: "1"
  # paths are relative to Task[03], not a laptop path
  model_file: models/final_model.joblib
  feature_list: models/05_feature_list.json
  transformers_dir: models/transformers

logging:
  level: INFO # INFO, WARNING, ERROR
  log_dir: logs
  log_file: logs/service.log
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

validation:
  on_fail: reject
  expectations_file: config/expectations.yaml
  max_missing_rate: 0.30

dvc:
  # local folder so dvc push works before a Studio account exists
  local_remote: storage
  # web app behind dvc.org. account steps are in DVC_ACCOUNT.md
  studio_url: https://studio.datachain.ai

mlflow:
  # local folder. no website account needed for this step
  tracking_uri: mlruns
  experiment: late_delivery
  registered_name: late_delivery
  stage: Production
  results_file: data/notebook6_metrics.json

api:
  host: 0.0.0.0
  port: 8000
  # open http://127.0.0.1:8000/docs after uvicorn starts

# filled from DATABASE_URL in docker. empty on the laptop is fine for now.
database:
  url: ""

monitoring:
  predictions_file: logs/predictions.jsonl
  # about the late share on the notebook test set
  baseline_late_rate: 0.066
  alert_late_rate_high: 0.15
  alert_error_rate_high: 0.05
  alert_latency_ms: 2000
  # written decisions: config/ALERTS.md

# only used to prove step 2 matches notebook 5. not used by the service later.
checks:
  notebook_x_test: ../Task[02]/artifacts/05_X_test.npy
  notebook_test_table: ../Task[02]/artifacts/03_test.pkl
